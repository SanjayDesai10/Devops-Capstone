# Grafana Helm values for BookShelf monitoring
# Install: helm install grafana grafana/grafana -n bookshelf -f grafana-values.yaml

adminUser: admin
adminPassword: admin

persistence:
  enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server:80
        access: proxy
        isDefault: true

# Pre-configured dashboard recommendations for UI:
# Recommended panels:
#   - HTTP Request Rate:   rate(http_requests_total[5m])
#   - Request Latency:     histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))
#   - Error Rate:          rate(http_requests_total{status=~"5.."}[5m])
