apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookshelf
  namespace: argocd
  labels:
    app.kubernetes.io/name: bookshelf
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/SanjayDesai10/Devops-Capstone.git
    targetRevision: HEAD
    path: bookshelf/helm/bookshelf
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: bookshelf
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
