# ============================================
# BookShelf Helm Values
# ============================================

namespace: bookshelf

# --- Backend ---
backend:
  image: ghcr.io/sanjaydesai10/devops-capstone/bookshelf-backend
  tag: "27d1fe24a54d5c9a67ea2ae7d615eb1add00dd1f"
  replicas: 1
  port: 8000
  env:
    DATABASE_URL: postgresql://bookshelf:bookshelf@bookshelf-postgres:5432/bookshelf

# --- Frontend ---
frontend:
  image: ghcr.io/sanjaydesai10/devops-capstone/bookshelf-frontend
  tag: "27d1fe24a54d5c9a67ea2ae7d615eb1add00dd1f"
  replicas: 1
  port: 3000

# --- PostgreSQL ---
postgres:
  image: postgres:16-alpine
  port: 5432
  env:
    POSTGRES_USER: bookshelf
    POSTGRES_PASSWORD: bookshelf
    POSTGRES_DB: bookshelf
  storage: 5Gi

# --- Ingress ---
ingress:
  enabled: true
  className: nginx
  host: bookshelf.local
