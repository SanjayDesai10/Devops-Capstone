apiVersion: v1
kind: Service
metadata:
  name: bookshelf-postgres
  namespace: {{ .Values.namespace }}
  labels:
    app: bookshelf-postgres
spec:
  type: ClusterIP
  selector:
    app: bookshelf-postgres
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
      protocol: TCP
