apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookshelf-postgres
  namespace: {{ .Values.namespace }}
  labels:
    app: bookshelf-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookshelf-postgres
  template:
    metadata:
      labels:
        app: bookshelf-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: {{ .Values.postgres.port }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.env.POSTGRES_USER }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.env.POSTGRES_PASSWORD }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.env.POSTGRES_DB }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: bookshelf-postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookshelf-postgres-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
