apiVersion: v1
kind: Service
metadata:
  name: bookshelf-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: bookshelf-backend
spec:
  type: ClusterIP
  selector:
    app: bookshelf-backend
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
      protocol: TCP
