# ============================================
# BookShelf CI/CD Pipeline — GitHub Actions
# Covers M5 (CI/CD) + M6 (DevSecOps / Trivy)
# ============================================

name: BookShelf CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ── Job 1: Run pytest ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd bookshelf/backend
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          cd bookshelf/backend
          pytest -v

  # ── Job 2: Build frontend ──
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build frontend
        run: |
          cd bookshelf/frontend
          npm install
          npm run build

  # ── Job 3: Build & push Docker images to GHCR ──
  build-and-push:
    needs: [test, build-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./bookshelf/backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/bookshelf-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./bookshelf/frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/bookshelf-frontend:${{ github.sha }}

  # ── Job 4: Trivy security scan (M6) ──
  security-scan:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy scan — backend image
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/bookshelf-backend:${{ github.sha }}
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL

      - name: Trivy scan — frontend image
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/bookshelf-frontend:${{ github.sha }}
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL
